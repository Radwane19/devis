<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulaire Devis</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 700px;
      color: #e0e0e0;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #fff;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #90aec6;
      margin-bottom: 32px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #7eb8d4;
      font-weight: 600;
    }

    input, select {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      outline: none;
      appearance: none;
    }

    input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    input:focus, select:focus {
      border-color: #4da6d9;
      background: rgba(77,166,217,0.1);
      box-shadow: 0 0 0 3px rgba(77,166,217,0.2);
    }

    select option {
      background: #16213e;
      color: #e0e0e0;
    }

    /* Articles list */
    #articles-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .article-row {
      display: grid;
      grid-template-columns: 1fr 36px;
      gap: 8px;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.08);
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .article-row input {
      margin: 0;
      padding: 8px 10px;
      font-size: 0.88rem;
    }

    .article-row .col-label {
      font-size: 0.72rem;
      color: #7eb8d4;
      text-align: center;
    }

    .header-row {
      display: grid;
      grid-template-columns: 1fr 100px 36px;
      gap: 8px;
      padding: 0 12px;
      margin-bottom: 2px;
    }

    .btn-remove {
      background: rgba(220, 60, 60, 0.3);
      border: 1px solid rgba(220, 60, 60, 0.5);
      border-radius: 8px;
      color: #ff8080;
      cursor: pointer;
      font-size: 1rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-remove:hover {
      background: rgba(220, 60, 60, 0.6);
    }

    .btn-add {
      background: rgba(77,166,217,0.15);
      border: 1px dashed rgba(77,166,217,0.5);
      border-radius: 10px;
      color: #4da6d9;
      cursor: pointer;
      font-size: 0.88rem;
      padding: 10px;
      text-align: center;
      transition: all 0.2s;
      margin-top: 4px;
    }

    .btn-add:hover {
      background: rgba(77,166,217,0.25);
    }

    .btn-calculate {
      grid-column: span 2;
      background: linear-gradient(135deg, #4da6d9, #2e86c1);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(77,166,217,0.35);
    }

    .btn-calculate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(77,166,217,0.5);
    }

    .btn-calculate:active {
      transform: translateY(0);
    }

    /* Résultat */
    .result-card {
      margin-top: 28px;
      background: rgba(77, 166, 217, 0.08);
      border: 1px solid rgba(77, 166, 217, 0.3);
      border-radius: 16px;
      padding: 24px;
      display: none;
    }

    .result-card.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .result-card h2 {
      font-size: 1rem;
      color: #7eb8d4;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .result-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.92rem;
    }

    .result-line:last-child {
      border-bottom: none;
    }

    .result-line .label {
      color: #90aec6;
    }

    .result-line .value {
      font-weight: 600;
      color: #fff;
    }

    .result-total {
      margin-top: 14px;
      background: linear-gradient(135deg, rgba(77,166,217,0.2), rgba(46,134,193,0.2));
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
    }

    .result-total .label {
      font-weight: 700;
      color: #c8e6f7;
    }

    .result-total .value {
      font-size: 1.5rem;
      font-weight: 800;
      color: #4da6d9;
    }

    .error {
      color: #ff8080;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
      .btn-calculate { grid-column: span 1; }
      .container { padding: 18px 14px; max-width: 100%; }
      h1 { font-size: 1.4rem; }
      .subtitle { font-size: 0.85rem; }
      input, select { padding: 11px 12px; font-size: 0.9rem; }
      label { font-size: 0.75rem; }
      .article-row {
        grid-template-columns: 1fr 36px;
        gap: 4px;
        padding: 8px 10px;
      }
      .header-row {
        grid-template-columns: 1fr 70px 36px;
        gap: 4px;
        padding: 0 10px;
      }
      .result-total {
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
        text-align: left;
      }
      .result-total .value {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 480px) {
      body { padding: 8px; }
      .container { padding: 14px 10px; max-width: 100%; }
      h1 { font-size: 1.15rem; margin-bottom: 5px; }
      .subtitle { font-size: 0.78rem; margin-bottom: 18px; }
      .form-grid { gap: 14px; }
      .form-group { gap: 3px; }
      input, select { padding: 9px 10px; font-size: 0.85rem; min-height: 40px; }
      label { font-size: 0.68rem; }
      input[type="checkbox"] { width: 18px; height: 18px; margin-right: 6px; cursor: pointer; }
      label input[type="checkbox"] { margin: 0 6px 0 0; }
      .btn-calculate { padding: 11px; font-size: 0.92rem; }
      .btn-remove { width: 32px; height: 32px; min-height: 32px; font-size: 0.95rem; }
      .btn-add { padding: 8px; font-size: 0.78rem; }
      .article-row { gap: 3px; padding: 6px 8px; }
      .header-row { gap: 3px; padding: 0 8px; }
      .result-card { padding: 14px; }
      .result-card h2 { font-size: 0.93rem; margin-bottom: 12px; }
      .result-line { font-size: 0.82rem; padding: 5px 0; }
      .result-total { padding: 11px 12px; }
      .result-total .value { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📦 Formulaire Devis</h1>
  <p class="subtitle">Calculez le coût total de votre commande</p>

  <div class="form-grid">

    <!-- Catégorie -->
    <div class="form-group">
      <label for="categorie">Catégorie</label>
      <select id="categorie">
        <option value="">— Sélectionner —</option>
        <option value="vetementslegers">Vêtements légers</option>
        <option value="vetementslourds">Vêtements lourds</option>
        <option value="chaussureslegers">Chaussures légers</option>
        <option value="chaussureslourds">Chaussures lourds</option>
        <option value="sacs">Sacs</option>
        <option value="montres">Montres</option>
        <option value="bijoux">Bijoux</option>
        <option value="maquillage">Maquillage</option>
        <option value="ongles">Ongles & faux cils</option>
        <option value="soins">Skincare / soins</option>
        <option value="lunettes">Lunettes</option>
        <option value="cheveux">Accessoires cheveux</option>
        <option value="acctelephone">Accessoires téléphone</option>
        <option value="deco">Maison déco</option>
        <option value="jouets">Jouets enfants</option>
        <option value="sousvetement">Sous-vêtements</option>
        <option value="autre">Autre</option>
      </select>
    </div>

    <!-- Poids total -->
    <div class="form-group">
      <label for="poids">Poids total (kg)</label>
      <input type="number" id="poids" placeholder="ex : 2.5" min="0" step="0.1" />
    </div>

    <!-- Prix unitaire -->
    <div class="form-group">
      <label for="prix-unitaire">Prix unitaire (€)</label>
      <input type="number" id="prix-unitaire" placeholder="ex : 19.99" min="0" step="0.01" />
    </div>

    <!-- Multiplication -->
    <div class="form-group">
      <label for="multiplication">Multiplication</label>
      <input type="number" id="multiplication" placeholder="ex : 5" min="0" step="0.1" />
    </div>

    <!-- Livraison gratuite -->
    <div class="form-group full-width">
      <label>
        <input type="checkbox" id="livraison-gratuite" checked /> Livraison gratuite
      </label>
    </div>

    <!-- Bouton -->
    <button class="btn-calculate full-width" onclick="calculate()" style="grid-column:span 2">
      Calculer le résultat
    </button>

  </div>

  <!-- Résultat -->
  <div class="result-card" id="result-card">
    <h2>📊 Résultat</h2>
    <div id="result-lines"></div>
    <div class="result-total">
      <span class="label">💰 Total</span>
      <span class="value" id="result-total-value">—</span>
    </div>
  </div>
</div>

<script>
  // --- State ---

  const poidsParCategorie = {
    vetementslegers: 0.3,
    vetementslourds: 0.8,
    chaussureslegers: 0.4,
    chaussureslourds: 0.7,
    sacs: 0.5,
    montres: 0.2,
    bijoux: 0.1,
    maquillage: 0.25,
    ongles: 0.15,
    soins: 0.4,
    lunettes: 0.2,
    cheveux: 0.15,
    acctelephone: 0.2,
    deco: 1.5,
    jouets: 0.7,
    sousvetement: 0.25,
    autre: 1
  };

  const categorieLibelles = {
    vetementslegers: 'Vêtements légers',
    vetementslourds: 'Vêtements lourds',
    chaussureslegers: 'Chaussures légers',
    chaussureslourds: 'Chaussures lourds',
    sacs: 'Sacs',
    montres: 'Montres',
    bijoux: 'Bijoux',
    maquillage: 'Maquillage',
    ongles: 'Ongles & faux cils',
    soins: 'Skincare / soins',
    lunettes: 'Lunettes',
    cheveux: 'Accessoires cheveux',
    acctelephone: 'Accessoires téléphone',
    deco: 'Maison déco',
    jouets: 'Jouets enfants',
    sousvetement: 'Sous-vêtements',
    autre: 'Autre'
  };

  const tarifDinar = {
    vetementslegers: { multMax: 5 },
    vetementslourds: { multMax: 5 },
    chaussureslegers: { multMax: 5 },
    chaussureslourds: { multMax: 6 },
    sacs: { multMax: 6 },
    montres: { multMax: 8 },
    bijoux: { multMax: 12 },
    maquillage: { multMax: 8 },
    ongles: { multMax: 10 },
    soins: { multMax: 8 },
    lunettes: { multMax: 7 },
    cheveux: { multMax: 7 },
    acctelephone: { multMax: 7 },
    deco: { multMax: 6 },
    jouets: { multMax: 6 },
    sousvetement: { multMax: 5 },
    autre: 'Autre'
  };

  function formatDinar(value) {
    return `${value.toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 0 })} TND`;
  }

  function getMultiplicationForBijoux(prix) {
    if (prix <= 1) return 10;
    if (prix > 1 && prix <= 2) return 9;
    if (prix > 2 && prix <= 5) return 8;
    if (prix > 5 && prix <= 10) return 7;
    if (prix > 10) return 6; // moyenne de 6 à 7
    return 10; // default
  }

  let poidsManuel = false;

  document.getElementById('poids').addEventListener('input', () => {
    poidsManuel = true;
  });

  document.getElementById('prix-unitaire').addEventListener('input', function () {
    const categorie = document.getElementById('categorie').value;
    if (categorie === 'bijoux') {
      const prix = parseFloat(this.value) || 0;
      document.getElementById('multiplication').value = getMultiplicationForBijoux(prix);
    }
    calculate(); // recalcul auto
  });

  document.getElementById('livraison-gratuite').addEventListener('change', calculate);

  document.getElementById('categorie').addEventListener('change', function () {
    const categorie = this.value;
    const poidsInput = document.getElementById('poids');

    if (!poidsManuel && poidsParCategorie[categorie] !== undefined) {
      poidsInput.value = poidsParCategorie[categorie];
    }

    if (categorie === 'bijoux') {
      const prix = parseFloat(document.getElementById('prix-unitaire').value) || 0;
      document.getElementById('multiplication').value = getMultiplicationForBijoux(prix);
    } else {
      const rule = tarifDinar[categorie];
      document.getElementById('multiplication').value = rule ? rule.multMax : '';
    }

    calculate(); // recalcul auto
  });

  function calculate() {
    const categorie    = document.getElementById('categorie').value;
    const poids        = parseFloat(document.getElementById('poids').value) || 0;
    const prixUnitaire = parseFloat(document.getElementById('prix-unitaire').value) || 0;
    const mult         = parseFloat(document.getElementById('multiplication').value) || 0;
    const livraisonGratuite = document.getElementById('livraison-gratuite').checked;

    // Frais de livraison selon poids : 1 kg = 7 €
    let fraisLivraison = livraisonGratuite ? 0 : (poids > 0 ? poids * 7 : 0);

    // Règle spéciale : si prix < 10€ et poids > 0.5kg, appliquer livraison
    if (prixUnitaire < 10 && poids > 0.5) {
      fraisLivraison = poids * 7;
    }

    const ttcTotal = prixUnitaire + fraisLivraison;

    // Prix en dinars : prix unitaire * multiplication + (livraison * 3.5)
    const prixDinar = (prixUnitaire * mult) + (fraisLivraison * 3.5);

    // Affichage
    const card  = document.getElementById('result-card');
    const lines = document.getElementById('result-lines');
    const totalEl = document.getElementById('result-total-value');

    let html = '';

    if (categorie) {
      html += line('Catégorie', categorieLibelles[categorie] || categorie);
    }

    if (poids > 0)
      html += line('Poids', `${poids} kg`);

    if (prixUnitaire > 0)
      html += line('Prix unitaire', fmt(prixUnitaire));

    if (mult > 0)
      html += line('Multiplication', mult);

    if (fraisLivraison > 0)
      html += line(`Livraison (${poids} kg)`, `+ ${fmt(fraisLivraison)}`);
    else
      html += line('Livraison', 'Gratuite');

    html += line('Prix en dinars', formatDinar(prixDinar));

    lines.innerHTML = html;
    totalEl.textContent = fmt(ttcTotal);

    card.classList.add('show');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function line(label, value) {
    return `<div class="result-line">
      <span class="label">${label}</span>
      <span class="value">${value}</span>
    </div>`;
  }

  function fmt(val) {
    return val.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
  }
</script>

</body>
</html>
